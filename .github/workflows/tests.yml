# Lance les tests à chaque push et à chaque pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt sur la machine de GitHub.
      - uses: actions/checkout@v4
      # Installe la même version de Python qu'en local.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m pytest
